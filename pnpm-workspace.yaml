strictDepBuilds: true

# Keep dependency lifecycle execution explicit for pnpm 10+ in CI and the
# floating Corepack version used by container builds.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

overrides:
  '@xmldom/xmldom@>=0.7.0 <=0.8.13': ^0.8.15
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': ^0.8.15
  '@xmldom/xmldom@>=0.9.0 <=0.9.10': ^0.9.12
  '@xmldom/xmldom@>=0.9.0 <=0.9.11': ^0.9.12
  '@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11': ^0.9.12
  '@xmldom/xmldom@>=0.9.0-beta.9 <=0.9.10': ^0.9.12
  '@xmldom/xmldom@>=0.9.10 <=0.9.11': ^0.9.12
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  lodash-es: 4.18.1
  tar@<=7.5.17: ^7.5.18
  tar@<=7.5.18: ^7.5.19
  tar@<=7.5.20: ^7.5.21
  tmp@<0.2.6: ^0.2.6
  undici@<6.27.0: ^6.27.0
