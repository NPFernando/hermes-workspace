# Phase 2.5-002: Build + lint workflow
# Runs on all PRs and pushes to main

name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint changed source files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          FILES="$(git diff --name-only --diff-filter=d "$BASE_SHA" "$GITHUB_SHA" -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx')"
          if [ -n "$FILES" ]; then
            pnpm exec eslint $FILES --no-ignore
          else
            echo "No changed JavaScript or TypeScript files to lint"
          fi

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output exists"
            ls -la dist/
          else
            echo "❌ No dist folder found"
            exit 1
          fi
      - name: Check SSR/client asset integrity
        run: pnpm run check:build-integrity
      - name: Check bundle budgets
        run: pnpm run check:bundle

      - name: Check theme accessibility contrast
        run: pnpm run check:accessibility

      - name: Verify Electron server bundle
        run: |
          pnpm run electron:bundle-server 2>&1 | tee /tmp/hermes-electron-bundle.log
          if grep -E '(^|\[)WARNING|referenced in .*didn.t resolve' /tmp/hermes-electron-bundle.log; then
            echo 'Electron bundle emitted a warning'
            exit 1
          fi
          git diff --check -- electron/server-bundle.cjs
          git diff --exit-code -- electron/server-bundle.cjs

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium for finance browser journey
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Run isolated Postgres queue integration
        run: pnpm run test:queue:isolated

      - name: Run finance browser journey
        run: pnpm run test:e2e:finance

      - name: Run authenticated workspace journey
        if: ${{ github.event_name == 'schedule' || (secrets.AUTH_E2E_PASSWORD != '' && secrets.AUTH_E2E_BASE_URL != '') }}
        env:
          AUTH_E2E_PASSWORD: ${{ secrets.AUTH_E2E_PASSWORD }}
          AUTH_E2E_BASE_URL: ${{ secrets.AUTH_E2E_BASE_URL }}
        run: pnpm run test:e2e:auth

      - name: Report authenticated journey skip
        if: ${{ github.event_name != 'schedule' && (secrets.AUTH_E2E_PASSWORD == '' || secrets.AUTH_E2E_BASE_URL == '') }}
        run: echo '::notice::Authenticated workspace journey skipped; configure AUTH_E2E_PASSWORD and AUTH_E2E_BASE_URL, then rerun workflow_dispatch.'
